# games.tylerirl.com: the short name both games' share links go out under. Only the share paths are open, all sent
# to the cancel game's service (cancel-api.service, 127.0.0.1:8787); everything else stays on cancel-api.tylerirl.com.
#   /n/ID               the network is growing: a share link (a preview page for robots, a forward to the game for people)
#   /n/ID.png           its card (served as /api/net/… by network_api.py)
#   /r/ID               the cancel is coming: a run's share link
#   /api/card/ID.png    its card
# The cancel's links use this name once /etc/cancel-api.env has CANCEL_PUBLIC=https://games.tylerirl.com; links
# already out on cancel-api.tylerirl.com keep working there.
# Install: /etc/nginx/sites-available/games, linked into sites-enabled, then: certbot --nginx -d games.tylerirl.com
server {
  listen 80;
  server_name games.tylerirl.com;

  location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

  location ~ "^/n/([0-9a-f]{10})\.png$" {
    limit_req zone=cancelapi burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787/api/net/card/$1.png;
    proxy_read_timeout 20s;  # a card is drawn the first time it's asked for
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ "^/n/([0-9a-f]{10})$" {
    limit_req zone=cancelapi burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787/api/net/s/$1;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ "^/r/[a-z0-9]{8}$" {
    limit_req zone=cancelapi burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
  }
  location ~ "^/api/card/[a-z0-9]{8}\.png$" {
    limit_req zone=cancelapi burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
  }
  location / { return 302 https://tylerirl.com/; }
}
